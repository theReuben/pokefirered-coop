name: Release Distributable

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      draft:
        description: 'Publish as draft release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      draft:
        description: 'Publish as draft release (true/false)'
        required: false
        default: 'true'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Build FireRed ROM (Linux; shared as artifact) ──────────────────────
  build-rom:
    name: Build FireRed ROM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Cache pokeemerald build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build FireRed ROM
        run: make firered -j$(nproc) -O

      - name: Verify ROM size (≥ 16 MiB)
        run: |
          BYTES=$(wc -c < pokefirered.gba)
          echo "ROM size: $BYTES bytes"
          test "$BYTES" -ge 16777216

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokefirered-rom
          path: pokefirered.gba
          retention-days: 1

  # ── Job 2: Build Tauri app on each platform ────────────────────────────────────
  build-tauri:
    name: Build ${{ matrix.platform.name }}
    needs: build-rom
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: '--target universal-apple-darwin --features mgba'
          - name: Linux (x86_64)
            os: ubuntu-latest
            rust-targets: ''
            tauri-args: '--features mgba'
          - name: Windows (x86_64)
            os: windows-latest
            rust-targets: ''
            tauri-args: '--features mgba'

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download ROM artifact
        uses: actions/download-artifact@v4
        with:
          name: pokefirered-rom

      - name: Bundle ROM into Tauri resource directory
        shell: bash
        run: |
          mkdir -p tauri-app/src-tauri/rom
          cp pokefirered.gba tauri-app/src-tauri/rom/pokefirered.gba
          echo "ROM bundled ($(wc -c < pokefirered.gba) bytes)"

      - name: Generate placeholder app icons
        run: python3 tools/gen-icons.py

      # Resolve the release tag from either a pushed tag or a manual/called input.
      # Inputs take priority so workflow_dispatch and workflow_call always use the
      # supplied tag rather than the branch name that github.ref_name would give.
      - name: Resolve release tag and bump version
        id: release
        shell: bash
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing tag=$TAG  version=$VERSION"

          # Update version in all three project files so built artefacts are named
          # correctly (e.g. pokefirered-coop_0.2.0_amd64.deb, not _0.1.0_).
          python3 - "$VERSION" <<'PYEOF'
          import json, re, sys
          ver = sys.argv[1]

          for path in ('tauri-app/src-tauri/tauri.conf.json', 'tauri-app/package.json'):
              with open(path) as f:
                  d = json.load(f)
              d['version'] = ver
              with open(path, 'w') as f:
                  json.dump(d, f, indent=2, ensure_ascii=False)
                  f.write('\n')
              print(f'  {path}: version = {ver}')

          cargo = open('tauri-app/src-tauri/Cargo.toml').read()
          cargo = re.sub(r'^version = ".*"', f'version = "{ver}"', cargo,
                         count=1, flags=re.MULTILINE)
          open('tauri-app/src-tauri/Cargo.toml', 'w').write(cargo)
          print(f'  tauri-app/src-tauri/Cargo.toml: version = {ver}')
          PYEOF

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci --legacy-peer-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-targets }}

      - name: Cache Cargo registry + build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-app/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install Linux system libraries + cmake
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config \
            cmake \
            zlib1g-dev

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: 'Pokémon FireRed Co-Op ${{ steps.release.outputs.tag }}'
          releaseBody: |
            ## Pokémon FireRed Co-Op ${{ steps.release.outputs.tag }}

            2-player networked co-op for Pokémon FireRed. Both players explore Kanto simultaneously with a shared world, randomized wild encounters (on by default), and co-op gym leader battles.

            ### Downloads

            | Platform | File | Notes |
            |---|---|---|
            | macOS (Apple Silicon + Intel) | `*.dmg` | Drag to Applications |
            | Windows | `*-setup.exe` | Run the installer |
            | Linux (Debian/Ubuntu) | `*.deb` | `sudo dpkg -i *.deb` |

            ### First-time setup

            See **[PLAYING.md](https://github.com/${{ github.repository }}/blob/main/PLAYING.md)** for full setup and play instructions.

            ### Requirements

            - Two computers, each running this app
            - Internet connection (relay at `pokefirered-coop.thereuben.partykit.dev`)
          releaseDraft: ${{ inputs.draft || 'true' }}
          prerelease: false
          args: ${{ matrix.platform.tauri-args }}

  # ── Job 3: Deploy the PartyKit relay ──────────────────────────────────────────
  # Runs independently of the ROM/app build: the relay is a separate edge service
  # the released apps connect to (pokefirered-coop.thereuben.partykit.dev). The
  # deployed edge must stay current — a stale edge silently drops {type:"raw"}
  # messages (state beacon, battle-turn, party-sync, gender, follower gfx), which
  # breaks co-op. `npm ci` triggers the patch-package postinstall that fixes the
  # partykit-0.0.110 deploy crash (path.dirname on a file:// URL) on the runner.
  #
  # Auth: set repo secrets PARTYKIT_TOKEN and PARTYKIT_LOGIN. Generate the token
  # locally with `npx partykit token generate` (run from relay-server/ after
  # `partykit login`); PARTYKIT_LOGIN is the partykit username (e.g. "thereuben").
  # If the secret is absent the job warns and skips rather than failing the run.
  deploy-relay:
    name: Deploy PartyKit relay
    runs-on: ubuntu-latest
    env:
      PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
      PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: relay-server/package-lock.json

      - name: Install relay dependencies (runs patch-package via postinstall)
        working-directory: relay-server
        run: npm ci

      - name: Run relay tests
        working-directory: relay-server
        run: npm test

      - name: Deploy to PartyKit
        if: env.PARTYKIT_TOKEN != ''
        working-directory: relay-server
        run: npm run deploy

      - name: Skip notice (no PartyKit credentials)
        if: env.PARTYKIT_TOKEN == ''
        run: echo "::warning::PARTYKIT_TOKEN not set — relay deploy skipped. Add repo secrets PARTYKIT_TOKEN and PARTYKIT_LOGIN to enable automatic relay deploys."
